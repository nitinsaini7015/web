<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .nav-main{
        background-color: darkslategrey;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }
    .nav-link ul{
        list-style: none;
        display: flex;
        gap: 150px;
    }
    .nav-btn button{
        background-color: green;
        color: white;
        padding: 5px;
        width: 150px;
        border-radius: 5px;
        cursor: pointer;
    }
    .nav-logo{
        font-size: 40px;
        font-weight: bold;
    }
    @media(max-width:995px){
        .nav-link ul{
        list-style: none;
        display: flex;
        gap: 150px
    }
}
</style>
<body>
    <nav>
        <div class="nav-main">
            <div class="nav-logo">
                <p>LOGO</p>
            </div>
            <div class="nav-link ul">
                <ul>
                    
                <li>HOME</li>
                <li>PAGE</li>
                <li>LIST</li>
                <li>FILE</li>
                <li>Products</li>
                </ul>
            </div>
            <div class="nav-btn">
                <button>Submit</button>
            </div>
        </div>
    </nav>
</body>
</html>
