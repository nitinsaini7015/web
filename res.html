<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .nav-logo{
        font-size: 30px;
        font-weight: bold;
    }
    .nav-btn button{
        background-color: green;
        color: white;
        padding: 5px;
        width: 100px;
        border-radius: 5px;
        cursor: pointer; 
    }
    .nav-main{
        background-color: darkslategrey;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }
    .nav-link ul{
        list-style: none;
        display: flex;
        gap: 150px
    }
    @media(max-width: 998px){
   .nav-link ul{
        display: none;
    }
    }
    .nav-hero{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    
</style>
<body>
  <nav>
    <div class="nav-main">
        <div class="nav-logo">
            <p>LOGO</p>
        </div>
        <div class=" nav-link ul">
            <ul>
                <li>HOME</li>
                <li>PAGE</li>
                <li>LIST</li>
                <li>FILE</li>
                <li>Products</li>
            </ul>
        </div>
        <div class=" nav-btn">
            <button>OPEN</button>
        </div>
    </div>
  </nav>
 <div class="nav-hero">
     <section>
    <h1>Welcome in this Page</h1> <br>  
    <p> You can learn more about structure and <br> rules from the The Writing Center Guide.</p>
  </section>
 </div>
</body>
</html>
